<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=https://goto-safer-bobby-helmet.trycloudflare.com/session/utby/watch" />
    <title>Kyrka Hemma - Utby</title>
    <meta name="description" content="Välkommen! Du skickas nu till direktöversättningen för Utby Församling." />
    <meta property="og:title" content="Kyrka Hemma - Utby" />
    <meta property="og:description" content="Välkommen! Du skickas nu till direktöversättningen..." />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 36px 28px;
        max-width: 420px;
        width: 100%;
        text-align: center;
        box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.03);
      }

      .icon-container {
        position: relative;
        width: 72px;
        height: 72px;
        margin: 0 auto 24px auto;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f0f9ff;
        border-radius: 50%;
        color: #0284c7;
      }

      .spinner-ring {
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: #0284c7;
        border-right-color: #0284c7;
        animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #0f172a;
        margin-bottom: 10px;
      }

      .description {
        font-size: 16px;
        line-height: 1.5;
        color: #475569;
        margin-bottom: 24px;
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #f1f5f9;
        color: #334155;
        font-size: 13px;
        font-weight: 500;
        padding: 6px 14px;
        border-radius: 9999px;
        margin-bottom: 28px;
      }

      .pulse-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #0284c7;
        box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.7);
        animation: pulse 1.8s infinite;
      }

      @keyframes pulse {
        0% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.7);
        }
        70% {
          transform: scale(1);
          box-shadow: 0 0 0 8px rgba(2, 132, 199, 0);
        }
        100% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(2, 132, 199, 0);
        }
      }

      .fallback-box {
        border-top: 1px solid #f1f5f9;
        padding-top: 24px;
      }

      .fallback-label {
        font-size: 13px;
        color: #64748b;
        margin-bottom: 12px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        min-height: 50px;
        padding: 14px 24px;
        background-color: #0284c7;
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        border-radius: 12px;
        transition: background-color 0.15s ease, transform 0.1s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .btn:hover {
        background-color: #0369a1;
      }

      .btn:active {
        transform: scale(0.98);
        background-color: #075985;
      }

      .footer-note {
        margin-top: 24px;
        font-size: 12px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <main id="redirect-card" class="card">
      <div class="icon-container" aria-hidden="true">
        <div class="spinner-ring"></div>
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m5 8 6 6" />
          <path d="m4 14 6-6 2-3" />
          <path d="M2 5h12" />
          <path d="M7 2h1" />
          <path d="m22 22-5-10-5 10" />
          <path d="M14 18h6" />
        </svg>
      </div>

      <h1 id="welcome-heading">Välkommen!</h1>
      <p id="welcome-message" class="description">Du skickas nu till direktöversättningen...</p>

      <div class="status-badge">
        <span class="pulse-dot" aria-hidden="true"></span>
        <span>Ansluter till mötet...</span>
      </div>

      <div class="fallback-box">
        <p class="fallback-label">Startar inte omdirigeringen automatiskt?</p>
        <a
          id="fallback-button"
          class="btn"
          href="https://goto-safer-bobby-helmet.trycloudflare.com/session/utby/watch"
          rel="noopener noreferrer"
        >
          <span>Öppna direktöversättningen</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </a>
      </div>

      <footer class="footer-note">
        Utby Församling • Kyrka Hemma
      </footer>
    </main>

    <script>
      (function() {
        var targetUrl = "https://goto-safer-bobby-helmet.trycloudflare.com/session/utby/watch";
        var isInIframe = window.self !== window.top;
        if (!isInIframe) {
          window.location.replace(targetUrl);
        }
      })();
    </script>
  </body>
</html>
